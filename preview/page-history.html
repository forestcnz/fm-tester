<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FM Tester · 历史记录 · 重新设计</title>
<link rel="stylesheet" href="inkwell.css">
<style>
.h-main{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.h-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--fg-3)}
.h-empty svg{width:54px;height:54px;opacity:.4}
.h-empty h3{font-family:"Fraunces",serif;font-weight:500;font-size:18px;color:var(--fg-2)}
/* 详情 */
.h-detail{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.h-url-bar{display:flex;align-items:center;gap:11px;padding:13px 18px;border-bottom:1px solid var(--line);background:var(--bg-panel);flex-shrink:0}
.h-method{font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:13px;padding:4px 10px;border-radius:7px}
.h-url{flex:1;font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-time{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--fg-3);flex-shrink:0}
.h-split{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.h-req,.h-res{display:flex;flex-direction:column;min-height:0}
.h-req{flex:0 0 48%;border-bottom:1px solid var(--line)}
.h-res{flex:1}
.h-tabs{display:flex;align-items:center;gap:2px;padding:0 14px;height:32px;border-bottom:1px solid var(--line);background:var(--bg-panel);flex-shrink:0}
.htab{height:32px;padding:0 11px;font-size:12px;font-weight:600;color:var(--fg-2);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;transition:.13s}
.htab:hover{color:var(--fg)}.htab.on{color:var(--primary);border-bottom-color:var(--primary)}
.htab .c{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--fg-3);background:var(--bg-sunk);padding:1px 5px;border-radius:7px;margin-left:5px}
.h-tabs .lang{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--fg-3);background:var(--bg-sunk);padding:2px 7px;border-radius:5px}
.h-body{flex:1;overflow:auto;padding:12px 16px;background:var(--bg-app)}
.h-body::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:4px;border:2px solid var(--bg-app)}
.h-pane{display:none}.h-pane.on{display:block}
/* 只读键值表 */
.rkv{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--bg-panel)}
.rkv-h,.rkv-r{display:grid;grid-template-columns:1fr 1.4fr 1.5fr;align-items:center}
.rkv-h{background:var(--bg-sunk);height:30px;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--fg-3);text-transform:uppercase;letter-spacing:.05em}
.rkv-h span,.rkv-r span{padding:0 10px}
.rkv-r{height:32px;border-bottom:1px solid var(--line)}.rkv-r:last-child{border-bottom:none}
.rkv-r .k{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--m-put);font-weight:600}
.rkv-r .v{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rkv-empty{padding:24px;text-align:center;color:var(--fg-3);font-size:12px}
.codebox{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--bg-panel)}
.codebar{display:flex;align-items:center;gap:8px;height:30px;padding:0 12px;background:var(--bg-sunk);border-bottom:1px solid var(--line);font-size:11px;color:var(--fg-3)}
.codebar .mono{font-family:"IBM Plex Mono",monospace}
.codearea{padding:12px 14px;font-family:"IBM Plex Mono",monospace;font-size:12px;line-height:1.65;color:var(--fg);white-space:pre-wrap;word-break:break-all}
.tok-k{color:var(--m-put)}.tok-s{color:var(--m-get)}.tok-n{color:var(--m-post)}
.btype{font-size:11.5px;color:var(--fg-3);margin-bottom:9px}
.btype b{color:var(--fg-2);font-family:"IBM Plex Mono",monospace}
/* 响应状态 */
.h-status{display:flex;align-items:center;gap:18px;padding:10px 16px;background:var(--bg-panel);border-bottom:1px solid var(--line);flex-shrink:0}
.h-stat{display:flex;align-items:center;gap:7px;font-size:12.5px}
.h-stat .l{color:var(--fg-3);font-size:11px}
.h-stat .v{font-family:"Fraunces",serif;font-weight:600;font-size:15px}
.sc2{color:var(--ok)}.sc3{color:var(--primary)}.sc4{color:var(--warn)}.sc5{color:var(--err)}
/* 侧边日期分组 */
.dgrp{margin-bottom:2px}
.dhead{display:flex;align-items:center;gap:7px;height:30px;padding:0 9px;cursor:pointer;border-radius:7px;font-size:11.5px;font-weight:700;color:var(--fg-2);text-transform:uppercase;letter-spacing:.04em;user-select:none}
.dhead:hover{background:var(--bg-sunk)}
.dhead .dtw{width:12px;height:12px;display:grid;place-items:center;color:var(--fg-3);transition:transform .15s}
.dhead .dtw.open{transform:rotate(90deg)}
.dhead .dclr{margin-left:auto;width:20px;height:20px;border-radius:5px;display:grid;place-items:center;color:var(--fg-3);opacity:0;transition:.12s}
.dhead:hover .dclr{opacity:1}.dhead .dclr:hover{color:var(--err);background:var(--bg-panel)}
.dhead .dclr svg{width:12px;height:12px}
.dlist{overflow:hidden;max-height:0;transition:max-height .25s}
.dlist.open{max-height:1000px}
.hi{display:flex;align-items:center;gap:8px;height:32px;padding:0 9px 0 24px;border-radius:7px;cursor:pointer;transition:.12s;margin:1px 0}
.hi:hover{background:var(--bg-sunk)}
.hi.sel{background:var(--primary-soft)}
.hi.sel .hi-url{color:var(--primary)}
.hi .mtag{font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:700;min-width:34px;flex-shrink:0}
.hi-url{flex:1;font-size:11.5px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi-del{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;color:var(--fg-3);opacity:0;transition:.12s;flex-shrink:0}
.hi:hover .hi-del{opacity:1}.hi-del:hover{color:var(--err)}
.hi-del svg{width:11px;height:11px}
.load-more{text-align:center;padding:9px;font-size:11.5px;color:var(--primary);cursor:pointer;border-top:1px dashed var(--line);margin-top:4px}
.load-more:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="stage"><div class="frame theme-paper" id="frame">

  <div class="titlebar">
    <div class="tlights"><span class="tl-r"></span><span class="tl-y"></span><span class="tl-g"></span></div>
    <div class="brand"><div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18l6-12 4 8 6-4-4 8z"/></svg></div><div class="brand-name">FM <em>Tester</em></div><div class="brand-sub">Inkwell · 墨砚</div></div>
    <div class="tb-spacer"></div><div class="tb-actions"><button class="tb-btn" id="themeBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg></button></div>
  </div>

  <div class="toolbar">
    <div class="ws-select"><div class="ws-ico">A</div><span class="ws-name">Acme 电商平台</span><svg class="ws-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></div>
    <div class="cmdk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><span class="ph">搜索接口、切换环境或执行命令…</span><span class="kbd"><kbd>⌘</kbd><kbd>K</kbd></span></div>
  </div>

  <div class="body">
    <div class="rail">
      <div class="rail-grp"><a class="rail-item" href="redesign-preview.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="tip">集合</span></a><a class="rail-item" href="page-websocket.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3v4M16 3v4M4 11h16"/></svg><span class="tip">WebSocket</span></a><a class="rail-item" href="page-orchestration.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 6H15a3 3 0 0 1 3 3v6.5"/></svg><span class="tip">编排</span></a></div>
      <div class="rail-sep"></div>
      <div class="rail-grp"><a class="rail-item" href="page-environment.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36A5.4 5.4 0 0 1 12 3z"/></svg><span class="tip">环境变量</span></a><button class="rail-item on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"/></svg><span class="tip">历史记录</span></button></div>
      <div class="rail-sep"></div>
      <div class="rail-grp"><a class="rail-item" href="page-workspace.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span class="tip">工作区</span></a><a class="rail-item" href="page-chat.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/></svg><span class="tip">AI 对话</span></a></div>
    </div>

    <!-- 侧边：按日期分组 -->
    <div class="sidebar">
      <div class="sb-head"><div class="sb-title"><h2>历史记录</h2><div class="acts"><button class="mini-ico" id="clrAll" title="清空全部"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button></div></div>
        <div class="sb-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="histSearch" placeholder="过滤 URL…"></div>
      </div>
      <div class="sb-list" id="histList" style="padding:8px"></div>
    </div>

    <!-- 主：详情 -->
    <div class="main"><div class="h-main" id="hMain"></div></div>
  </div>

  <div class="statusbar">
    <div class="sb-l"><span class="v">v0.8.2</span><span class="git"><i></i>已同步 · main @ 2a3f1c</span></div>
    <div class="sb-c">历史记录 · <b>Acme 电商平台</b></div>
    <div class="sb-r"><span class="si"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>Cookie</span><span class="si"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 17l6-6-6-6M12 19h8"/></svg>控制台</span><span class="si on"><span class="dot"></span>Staging</span></div>
  </div>
</div></div>

<div class="toast-wrap" id="toasts"></div>
<div class="note"><span class="nd"></span><span><b>历史记录</b> · 按日期分组（展开/折叠、清空当日）；点击条目查看只读的请求/响应详情（参数/请求头/请求体 + 状态/耗时/大小 + 响应体/响应头）· <span class="tag">⌘.</span> 主题</span></div>

<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
$('#themeBtn').addEventListener('click',()=>{$('#frame').classList.toggle('theme-paper');$('#frame').classList.toggle('theme-dark');renderDetail();toast('已切换主题');});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='.'){e.preventDefault();$('#themeBtn').click();}});

const mCls={GET:'m-get',POST:'m-post',PUT:'m-put',PATCH:'m-patch',DELETE:'m-del'};
function scClass(s){s=+s;return s<300?'sc2':s<400?'sc3':s<500?'sc4':'sc5';}
let dates=['今天','昨天','06-24'];
let hist={
  '今天':[
    {id:'h1',method:'POST',url:'/api/v2/auth/login?client_id=web&redirect=https://acme.com',status:200,status_text:'OK',time:234,size:1240,created_at:'10:24:01',headers:[{key:'Content-Type',value:'application/json',enabled:true},{key:'X-Request-Id',value:'req-8f3a',enabled:true}],body_type:'raw',body:'{\n  "username": "alice@acme.com",\n  "password": "***"\n}',resp_headers:{'Content-Type':'application/json','X-Trace-Id':'req-8f3a','Set-Cookie':'session=abc; HttpOnly'},resp_body:'{\n  "code": 0,\n  "data": {\n    "user_id": 10293,\n    "access_token": "eyJhbGciOiJIUzI1NiIs..."\n  }\n}'},
    {id:'h2',method:'GET',url:'/api/v1/users/me',status:200,status_text:'OK',time:89,size:560,created_at:'10:23:30',headers:[{key:'Authorization',value:'Bearer eyJhbGci...',enabled:true}],body_type:'none',body:'',resp_headers:{'Content-Type':'application/json'},resp_body:'{\n  "user_id": 10293,\n  "name": "Alice Chen",\n  "role": "admin"\n}'},
    {id:'h3',method:'POST',url:'/api/v1/orders',status:500,status_text:'Internal Server Error',time:1200,size:320,created_at:'10:20:11',headers:[{key:'Content-Type',value:'application/json',enabled:true}],body_type:'raw',body:'{\n  "items": [{"sku": "A1", "qty": 2}]\n}',resp_headers:{'Content-Type':'application/json'},resp_body:'{\n  "error": "db lock timeout"\n}'},
  ],
  '昨天':[
    {id:'h4',method:'GET',url:'/api/v1/orders?page=1&size=20',status:200,status_text:'OK',time:156,size:4300,created_at:'18:42',headers:[],body_type:'none',body:'',resp_headers:{'Content-Type':'application/json'},resp_body:'{\n  "data": [/* 20 orders */],\n  "total": 184\n}'},
    {id:'h5',method:'PUT',url:'/api/v1/users/10293',status:200,status_text:'OK',time:112,size:240,created_at:'15:08',headers:[{key:'Authorization',value:'Bearer eyJ...',enabled:true}],body_type:'raw',body:'{\n  "name": "Alice C."\n}',resp_headers:{},resp_body:'{\n  "updated": true\n}'},
  ],
  '06-24':[
    {id:'h6',method:'DELETE',url:'/api/v1/users/9981',status:204,status_text:'No Content',time:67,size:0,created_at:'14:10',headers:[{key:'Authorization',value:'Bearer eyJ...',enabled:true}],body_type:'none',body:'',resp_headers:{},resp_body:''},
  ],
};
let expanded={'今天':true,'昨天':false,'06-24':false};
let selId='h1',reqTab='params',respTab='body',searchQ='';
const findItem=id=>{for(const d of dates){const f=hist[d].find(x=>x.id===id);if(f)return f;}return null;};
function escH(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function colorJson(s){return escH(s).replace(/"([^"]+)":/g,'<span class="tok-k">"$1"</span>:').replace(/: "([^"]*)"/g,': <span class="tok-s">"$1"</span>').replace(/: (-?\d+\.?\d*)/g,': <span class="tok-n">$1</span>');}
function parseUrlParams(url){if(!url||!url.includes('?'))return[];return url.split('?')[1].split('#')[0].split('&').map(p=>{const[k,v='']=p.split('=');return{key:decodeURIComponent(k),value:decodeURIComponent(v)};}).filter(p=>p.key);}
function fmtSize(b){if(!b)return'0 B';if(b<1024)return b+' B';return(b/1024).toFixed(1)+' KB';}

function renderList(){
  const w=$('#histList');w.innerHTML='';
  let any=false;
  dates.forEach(d=>{
    const items=hist[d].filter(it=>!searchQ||it.url.toLowerCase().includes(searchQ)||it.method.toLowerCase().includes(searchQ));
    if(!items.length)return;any=true;
    const grp=document.createElement('div');grp.className='dgrp';
    const head=document.createElement('div');head.className='dhead';
    head.innerHTML=`<span class="dtw ${expanded[d]?'open':''}"><svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg></span><span>${d} · ${items.length}</span><span class="dclr" title="清空当日"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></span>`;
    head.addEventListener('click',()=>{expanded[d]=!expanded[d];renderList();});
    head.querySelector('.dclr').addEventListener('click',e=>{e.stopPropagation();hist[d]=[];toast('已清空 '+d);renderList();if(selId&&!findItem(selId))renderEmpty();});
    grp.appendChild(head);
    const list=document.createElement('div');list.className='dlist'+(expanded[d]?' open':'');
    items.forEach(it=>{
      const r=document.createElement('div');r.className='hi'+(selId===it.id?' sel':'');
      const mt=it.method==='WebSocket'?'WS':(it.method==='DELETE'?'DEL':it.method);
      r.innerHTML=`<span class="mtag ${mCls[it.method]||''}">${mt}</span><span class="hi-url" title="${escH(it.url)}">${escH(it.url)}</span><span class="hi-del" title="删除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/></svg></span>`;
      r.addEventListener('click',()=>{selId=it.id;renderList();renderDetail();});
      r.querySelector('.hi-del').addEventListener('click',e=>{e.stopPropagation();hist[d]=hist[d].filter(x=>x.id!==it.id);toast('已删除');renderList();if(selId===it.id)renderEmpty();});
      list.appendChild(r);
    });
    if(items.length>=3){const lm=document.createElement('div');lm.className='load-more';lm.textContent='加载更多';lm.addEventListener('click',()=>toast('加载更多历史'));list.appendChild(lm);}
    grp.appendChild(list);w.appendChild(grp);
  });
  if(!any){w.innerHTML='<div style="padding:30px;text-align:center;color:var(--fg-3);font-size:12px">无匹配历史</div>';}
}

function renderEmpty(){$('#hMain').innerHTML='<div class="h-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"/></svg><h3>选择一条历史记录</h3><p style="font-size:12.5px">点击左侧查看请求与响应详情</p></div>';}

function renderDetail(){
  const it=findItem(selId);if(!it){renderEmpty();return;}
  const params=parseUrlParams(it.url);
  $('#hMain').innerHTML=`
  <div class="h-detail">
    <div class="h-url-bar"><span class="h-method ${mCls[it.method]||''}" style="background:var(--bg-sunk)">${it.method}</span><span class="h-url">${escH(it.url)}</span><span class="h-time">${escH(it.created_at)}</span></div>
    <div class="h-split">
      <div class="h-req">
        <div class="h-tabs"><button class="htab ${reqTab==='params'?'on':''}" data-t="params">参数 ${params.length?`<span class="c">${params.length}</span>`:''}</button><button class="htab ${reqTab==='headers'?'on':''}" data-t="headers">请求头 <span class="c">${it.headers.length}</span></button><button class="htab ${reqTab==='body'?'on':''}" data-t="body">请求体</button></div>
        <div class="h-body">
          <div class="h-pane ${reqTab==='params'?'on':''}" data-p="params">${params.length?`<div class="rkv"><div class="rkv-h"><span>参数名</span><span>值</span><span></span></div>${params.map(p=>`<div class="rkv-r"><span class="k">${escH(p.key)}</span><span class="v">${escH(p.value)}</span><span></span></div>`).join('')}</div>`:'<div class="rkv-empty">该请求无 URL 参数</div>'}</div>
          <div class="h-pane ${reqTab==='headers'?'on':''}" data-p="headers">${it.headers.length?`<div class="rkv"><div class="rkv-h"><span>键</span><span>值</span><span></span></div>${it.headers.map(h=>`<div class="rkv-r"><span class="k">${escH(h.key)}</span><span class="v">${escH(h.value)}</span><span></span></div>`).join('')}</div>`:'<div class="rkv-empty">无请求头</div>'}</div>
          <div class="h-pane ${reqTab==='body'?'on':''}" data-p="body">${it.body?`<div class="btype">Body 类型：<b>${it.body_type}</b></div><div class="codebox"><div class="codebar"><span class="mono">application/json</span></div><div class="codearea">${colorJson(it.body)}</div></div>`:'<div class="rkv-empty">该请求无请求体</div>'}</div>
        </div>
      </div>
      <div class="h-res">
        <div class="h-status"><div class="h-stat"><span class="l">状态</span><span class="v ${scClass(it.status)}">${it.status} ${escH(it.status_text)}</span></div><div class="h-stat"><span class="l">耗时</span><span class="v">${it.time}<small style="font-size:11px;color:var(--fg-3);font-family:Manrope"> ms</small></span></div><div class="h-stat"><span class="l">大小</span><span class="v">${fmtSize(it.size)}</span></div></div>
        <div class="h-tabs"><button class="htab ${respTab==='body'?'on':''}" data-rt="body">响应体</button><button class="htab ${respTab==='headers'?'on':''}" data-rt="headers">响应头 <span class="c">${Object.keys(it.resp_headers).length}</span></button><span class="lang">${it.resp_body?'json':'—'}</span></div>
        <div class="h-body">
          <div class="h-pane ${respTab==='body'?'on':''}" data-rp="body">${it.resp_body?`<div class="codebox"><div class="codebar"><span class="mono">application/json</span></div><div class="codearea">${colorJson(it.resp_body)}</div></div>`:'<div class="rkv-empty">无响应体</div>'}</div>
          <div class="h-pane ${respTab==='headers'?'on':''}" data-rp="headers">${Object.keys(it.resp_headers).length?`<div class="rkv"><div class="rkv-h"><span>键</span><span>值</span><span></span></div>${Object.entries(it.resp_headers).map(([k,v])=>`<div class="rkv-r"><span class="k">${escH(k)}</span><span class="v">${escH(v)}</span><span></span></div>`).join('')}</div>`:'<div class="rkv-empty">无响应头</div>'}</div>
        </div>
      </div>
    </div>
  </div>`;
  $$('#hMain .htab[data-t]').forEach(b=>b.addEventListener('click',()=>{reqTab=b.dataset.t;renderDetail();}));
  $$('#hMain .htab[data-rt]').forEach(b=>b.addEventListener('click',()=>{respTab=b.dataset.rt;renderDetail();}));
}

$('#histSearch').addEventListener('input',e=>{searchQ=e.target.value.toLowerCase().trim();renderList();});
$('#clrAll').addEventListener('click',()=>{if(!confirm('确认清空全部历史记录？'))return;dates.forEach(d=>hist[d]=[]);toast('已清空全部历史');renderList();renderEmpty();});

renderList();renderDetail();

function toast(msg){const w=$('#toasts');const t=document.createElement('div');t.className='toast';t.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'+msg;w.appendChild(t);setTimeout(()=>{t.style.transition='all .25s';t.style.opacity=0;t.style.transform='translateX(20px)';setTimeout(()=>t.remove(),250);},2200);}
</script>
</body>
</html>
