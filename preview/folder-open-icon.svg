<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Open folder -->
  <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2v1"/>
  <path d="M22 9H12"/>

  <!-- API endpoint nodes inside folder -->
  <circle cx="7" cy="14" r="1.5" fill="currentColor"/>
  <circle cx="12" cy="14" r="1.5" fill="currentColor"/>
  <circle cx="17" cy="14" r="1.5" fill="currentColor"/>

  <!-- Connection lines between nodes -->
  <line x1="8.5" y1="14" x2="10.5" y2="14"/>
  <line x1="13.5" y1="14" x2="15.5" y2="14"/>

  <!-- Pulse dot indicator -->
  <circle cx="19" cy="5" r="2" fill="currentColor">
    <animate attributeName="r" values="2;2.5;2" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.6;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>